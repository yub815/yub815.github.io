<h1>OBS 드라이브 업로더</h1>
<p>OBS로 녹화한 방송 파일을 녹화가 끝나면 자동으로 지정된 Google 드라이브 폴더에 업로드하는 Windows 프로그램입니다.</p>
<p>This Windows app automatically uploads finished OBS recordings to a designated Google Drive folder.</p>
<ul>
<li>사용 권한: <code>drive.file</code> (이 앱이 만든 폴더와 파일에만 접근)</li>
<li>개인정보처리방침: <a href="privacy.html">privacy.html</a></li>
</ul>
